<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="./Luniq.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Primary Meta Tags -->
  <title>Luniq Music by saraansx | The Aesthetic Open-Source Music Player</title>
  <meta name="title" content="Luniq Music by saraansx | The Aesthetic Open-Source Music Player" />
  <meta name="description" content="Luniq Music is a lightweight, ad-free desktop music player developed by saraansx. It leverages Spotify's metadata for a premium, distraction-free listening experience." />
  <meta name="keywords" content="Luniq Music, saraansx, Luniq Music Player, Open Source, Spotify client, Ad-free music, Electron player, Aesthetic UI" />
  <meta name="author" content="saraansx" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://github.com/saraansx/Luniq-Music" />
  <meta property="og:title" content="Luniq Music by saraansx | The Aesthetic Open-Source Music Player" />
  <meta property="og:description" content="Luniq Music (by saraansx): Experience your music with the slickest UI on the planet. Ad-free, open-source, and optimized for performance." />
  <meta property="og:image" content="https://raw.githubusercontent.com/saraansx/Luniq-Music/main/src/assets/Promotion/p4.png" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://github.com/saraansx/Luniq-Music" />
  <meta property="twitter:title" content="Luniq Music by saraansx | The Aesthetic Open-Source Music Player" />
  <meta property="twitter:description" content="Luniq Music Player by saraansx. Sleek, ad-free, and open-source. Discover the future of desktop music players." />
  <meta property="twitter:image" content="https://raw.githubusercontent.com/saraansx/Luniq-Music/main/src/assets/Promotion/p4.png" />

  <style>
    :root {
      --bg-base: #050608;
      --accent-glow: rgba(147, 51, 234, 0.25);
      --accent-cyan: rgba(56, 189, 248, 0.2);
    }
    * {
      box-sizing: border-box;
    }
    body {
      background-color: var(--bg-base);
      margin: 0;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    .initial-loading-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      background: radial-gradient(circle at 50% 45%, #0d0f18 0%, #050608 70%);
      z-index: 99999;
      opacity: 1;
      animation: initFadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .initial-glow-backdrop {
      position: absolute;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, var(--accent-glow) 0%, var(--accent-cyan) 40%, transparent 70%);
      filter: blur(48px);
      border-radius: 50%;
      pointer-events: none;
      animation: initGlowPulse 3s ease-in-out infinite alternate;
    }
    .initial-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .initial-logo-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: initFloat 4s ease-in-out infinite;
    }
    .initial-logo {
      width: 84px;
      height: 84px;
      object-fit: contain;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.6));
    }
    .initial-title {
      font-size: 22px;
      font-weight: 300;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      margin: 0;
      text-indent: 0.45em;
      color: #ffffff;
      text-shadow: 0 2px 12px rgba(255, 255, 255, 0.15);
    }
    .initial-subtitle {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      font-weight: 500;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      margin: -6px 0 12px 0;
      text-indent: 0.25em;
    }
    .initial-wave-loader {
      display: flex;
      align-items: center;
      gap: 5px;
      height: 20px;
    }
    .initial-wave-bar {
      width: 3px;
      height: 6px;
      background: linear-gradient(180deg, #a855f7 0%, #38bdf8 100%);
      border-radius: 99px;
      animation: initialWaveBounce 1.2s ease-in-out infinite;
    }
    .initial-wave-bar:nth-child(1) { animation-delay: 0.0s; }
    .initial-wave-bar:nth-child(2) { animation-delay: 0.15s; }
    .initial-wave-bar:nth-child(3) { animation-delay: 0.3s; }
    .initial-wave-bar:nth-child(4) { animation-delay: 0.45s; }
    .initial-wave-bar:nth-child(5) { animation-delay: 0.6s; }

    @keyframes initFadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes initFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes initGlowPulse {
      0% { transform: scale(0.85); opacity: 0.4; }
      100% { transform: scale(1.15); opacity: 0.8; }
    }
    @keyframes initialWaveBounce {
      0%, 100% { height: 4px; opacity: 0.3; }
      50% { height: 18px; opacity: 1; }
    }
  </style>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Luniq Music",
      "applicationCategory": "MultimediaApplication",
      "operatingSystem": "Windows, macOS, Linux",
      "author": {
        "@type": "Person",
        "name": "saraansx",
        "url": "https://github.com/saraansx"
      },
      "description": "Luniq Music is an aesthetic, open-source desktop music player developed by saraansx.",
      "url": "https://github.com/saraansx/Luniq-Music",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
  </script>
</head>

<body>
  <div id="root">
    <div class="initial-loading-container">
      <div class="initial-glow-backdrop"></div>
      <div class="initial-content">
        <div class="initial-logo-wrapper">
          <img src="./src/assets/Luniq.png" class="initial-logo" alt="Luniq Logo" />
        </div>
        <h1 class="initial-title">LUNIQ</h1>
        <p class="initial-subtitle">EXPERIENCE SOUND</p>
        <div class="initial-wave-loader">
          <div class="initial-wave-bar"></div>
          <div class="initial-wave-bar"></div>
          <div class="initial-wave-bar"></div>
          <div class="initial-wave-bar"></div>
          <div class="initial-wave-bar"></div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="./src/main.tsx"></script>
</body>

</html>
